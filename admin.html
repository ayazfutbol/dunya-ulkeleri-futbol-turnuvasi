<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli - Dünya Ülkeleri Futbol Turnuvası</title><style>body{margin:0;font-family:Arial,sans-serif;background:#071b31;color:#fff;padding:25px}.wrap{max-width:900px;margin:auto}.card{background:#fff;color:#111827;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 15px 45px #0006}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{background:#eff6ff;border-radius:14px;padding:18px}.stat b{display:block;font-size:30px;margin-top:6px}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>⚙️ Yönetim Paneli</h1><p>Ücretsiz GitHub Pages sürümü. Veriler yalnızca bu cihazdaki tarayıcıda tutulur.</p><div class="card"><div class="grid"><div class="stat">Oynanan turnuva<b id="games">0</b></div><div class="stat">Şampiyonluk<b id="champs">0</b></div><div class="stat">Son şampiyon<b id="last">-</b></div><div class="stat">Son seçilen ülke<b id="country">-</b></div></div><button class="blue" onclick="downloadData()">⬇️ İstatistikleri indir</button><button class="green" onclick="location.href='index.html'">🏠 Oyuna dön</button><button class="red" onclick="resetData()">🗑️ İstatistikleri sıfırla</button></div></div><script>function stats(){try{return JSON.parse(localStorage.getItem('dft_stats')||'{"games":0,"champions":0,"lastChampion":"","lastCountry":""}')}catch(e){return {games:0,champions:0,lastChampion:'',lastCountry:''}}}function render(){const s=stats();games.textContent=s.games||0;champs.textContent=s.champions||0;last.textContent=s.lastChampion||'-';country.textContent=s.lastCountry||'-'}function resetData(){if(confirm('Bu cihazdaki istatistikler silinsin mi?')){localStorage.removeItem('dft_stats');render()}}function downloadData(){const b=new Blob([JSON.stringify(stats(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dunya-futbol-istatistikleri.json';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
